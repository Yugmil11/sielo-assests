<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Sielo Robotics</title>
<meta name="description" content="Questions about ARLO? Contact the Sielo Robotics team.">
<link rel="icon" href="media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261028c">
</head>
<body class="sielo-body">
<div class="sielo sielo-page" id="sielo-root" data-form-page="contact">
<nav class="sielo-subnav">
  <a href="index.html" class="logo" aria-label="Sielo Robotics home"><img src="media/logo.png" alt="Sielo Robotics"></a>
  <div class="right">
    <div class="links">
      <a href="index.html" class="pill">Home</a>
      <a href="index.html#people" class="pill">People</a>
      <a href="index.html#faq" class="pill">FAQ</a>
      <a href="contact.html" class="pill is-active" aria-current="page">Contact</a>
    </div>
    <a href="https://calendly.com/evanzeglinskispinney/product-demo" target="_blank" rel="noopener" class="btn-nav">Book a Demo</a>
  </div>
</nav>
<main class="sielo-formpage">
  <div class="grid">
    <div class="intro">
      <h1>Contact Us</h1>
      <p class="lead">Have a question about ARLO or want to connect with our team? We'd love to hear from you.</p>
    </div>
    <div class="card" data-card>
      <form data-form novalidate>
        <div class="fields" data-fields></div>
        <label class="field full">
          <span class="lbl">Message<span class="req">*</span></span>
          <textarea name="message" rows="6" aria-required="true" data-required data-label="message"></textarea>
        </label>
        <label class="check">
          <input type="checkbox" name="newsletter">
          <span>Send me monthly updates from Sielo Robotics</span>
        </label>
        <p class="form-error" data-form-error hidden></p>
        <button type="submit" class="submit">Send Message</button>
      </form>
      <div class="sent" data-sent hidden role="status">
        <span class="tick"><svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#192042" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
        <h2>Thanks for reaching out!</h2>
        <p>We've received your message and will get back to you soon.</p>
        <a href="index.html" class="btn btn-ghost">Back to home</a>
      </div>
    </div>
  </div>
</main>
<footer class="sielo-footer">
  <div class="inner">
    <img src="media/logo.png" alt="Sielo Robotics">
    <div class="links">
      <a href="contact.html">Contact Us</a>
      <a href="#terms">Terms of Use</a>
      <a href="#privacy">Privacy Policy</a>
    </div>
    <p class="copy">Sielo Robotics © 2026</p>
  </div>
</footer>
</div>
<script src="app.js?v=20261028c"></script>
<script>SieloSite.mountForm(document.getElementById('sielo-root'));</script>
</body>
</html>
